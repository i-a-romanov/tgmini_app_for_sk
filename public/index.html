<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4b32df">
  <title>SK Fast Track</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/live.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="web-header"><button id="back" aria-label="Назад">‹ Назад</button><b>SK Fast Track</b><button id="profile" aria-label="Профиль">Профиль</button></header>
    <div id="dev-banner" hidden>Локальная разработка · тестовый профиль</div>
    <div id="notice" role="alert" hidden></div>
    <main id="content" tabindex="-1"><div class="loading"><div class="mark">SK</div><h1>Открываем ваш план</h1><p class="sub">Это займёт несколько секунд.</p></div></main>
    <footer id="action-bar" hidden><button class="main-button" id="primary"></button></footer>
  </div>
  <noscript>Для работы приложения необходимо включить JavaScript.</noscript>
</body>
</html>
