# Free pilot: services can sleep; free Postgres expires after 30 days.
services:
  - type: web
    name: sk-fast-track
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sk-fast-track-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: AUTO_CONFIGURE_BOT
        value: "true"
      - key: ENABLE_REMINDERS
        value: "true"
      - key: PILOT_MODE
        value: "true"
      - key: OPERATOR_NAME
        value: Команда SK Fast Track
databases:
  - name: sk-fast-track-db
    region: frankfurt
    plan: free
    databaseName: sk_fast_track
    user: sk_fast_track
    ipAllowList: []
